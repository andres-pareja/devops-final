name: estudiante20

services:
  db:
    container_name: est20_db
    image: postgres:18
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped

  api:
    container_name: est20_api
    build: .
    env_file: .env
    ports:
      - "8020:5000"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:

